<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webGerber — PCB Gerber Viewer</title>
  <meta name="description" content="ZIP으로 압축된 PCB 거버 데이터를 브라우저에서 바로 보는 뷰어">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='5' width='28' height='22' rx='3' fill='%2314612f'/%3E%3Ccircle cx='9' cy='12' r='2.5' fill='%23d8b158'/%3E%3Ccircle cx='23' cy='20' r='2.5' fill='%23d8b158'/%3E%3Cpath d='M9 12h7l7 8' stroke='%23d8b158' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><rect x="2" y="5" width="28" height="22" rx="3" fill="#14612f"/><circle cx="9" cy="12" r="2.5" fill="#d8b158"/><circle cx="23" cy="20" r="2.5" fill="#d8b158"/><path d="M9 12h7l7 8" stroke="#d8b158" stroke-width="1.6" fill="none"/></svg>
      <span>webGerber</span>
    </div>

    <div class="actions">
      <label class="btn primary" title="압축파일(ZIP·RAR·7Z·TAR) 또는 거버 파일 열기">
        <input id="fileInput" type="file" accept=".zip,.rar,.7z,.tar,.tgz,.gz,.tbz2,.bz2,.txz,.xz,.lzh,.cab,.gbr,.ger,.gtl,.gbl,.gts,.gbs,.gto,.gbo,.gtp,.gbp,.gko,.gm1,.drl,.xln,.txt,.cmp,.sol,.stc,.sts,.plc,.pls,.g1,.g2,.g3,.g4" multiple hidden>
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 20h16M12 4v12m0-12 5 5m-5-5L7 9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        파일 열기
      </label>
      <button id="sampleBtn" class="btn">샘플 보기</button>
    </div>

    <div class="seg" id="layoutSeg" role="group" aria-label="화면 분할">
      <button data-layout="single" class="on" title="거버 1개 보기">1개</button>
      <button data-layout="dual" title="화면을 나눠 거버 2개를 함께 보기">2개 비교</button>
    </div>

    <div class="seg" id="viewSeg" role="group" aria-label="보기">
      <button data-view="split" class="on">TOP + BOTTOM</button>
      <button data-view="top">TOP</button>
      <button data-view="bottom">BOTTOM</button>
    </div>
    <button id="linkBtn" class="btn toggle on" aria-pressed="true" title="TOP·BOTTOM 화면의 이동/확대를 함께 움직일지 선택 (끄면 각각 독립)">
      <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="cut" d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>TOP·BOTTOM 연동</span>
    </button>

    <div class="seg icons" id="orientSeg" role="group" aria-label="회전 / 반전">
      <button data-op="ccw" title="왼쪽으로 90° 회전 (Shift+R)"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.34-5.66"/><path d="M4 4v5h5"/></svg></button>
      <button data-op="cw" title="오른쪽으로 90° 회전 (R)"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>
      <button data-op="flipH" title="좌우 반전 (H)"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" stroke-dasharray="2 3"/><path d="M9 7 4 17h5z"/><path d="m15 7 5 10h-5z"/></svg></button>
      <button data-op="flipV" title="상하 반전 (V)"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18" stroke-dasharray="2 3"/><path d="M7 9 17 4v5z"/><path d="m7 15 10 5v-5z"/></svg></button>
      <button data-op="reset" class="text" title="회전·반전 원래대로 (Shift+O)">원위치</button>
    </div>

    <div class="seg" id="modeSeg" role="group" aria-label="표시 방식">
      <button data-mode="real" class="on">실사</button>
      <button data-mode="layer">레이어 색상</button>
    </div>

    <div class="zoom">
      <button id="zoomOut" class="btn icon" title="축소 (-)">−</button>
      <span id="zoomLabel">100%</span>
      <button id="zoomIn" class="btn icon" title="확대 (+)">+</button>
      <button id="zoomFit" class="btn" title="화면 맞춤 (0 / 더블클릭)">맞춤</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="ws-tabs" id="wsTabs" hidden>
        <button data-ws="0" class="on"><b>A</b><span>파일 없음</span></button>
        <button data-ws="1"><b>B</b><span>파일 없음</span></button>
      </div>
      <div class="side-head">
        <h2>레이어</h2>
        <div class="side-tools">
          <button id="allOn" class="link">모두 표시</button>
          <button id="allOff" class="link">모두 숨김</button>
        </div>
      </div>
      <div id="layerList" class="layer-list">
        <p class="empty">압축파일을 열면 레이어 목록이 표시됩니다.</p>
      </div>
    </aside>

    <section class="stage">
      <div id="slots" class="slots"></div>
    </section>

    <template id="slotTpl">
      <div class="slot">
        <div class="slot-head">
          <span class="slot-tag"></span>
          <span class="slot-name">파일 없음</span>
          <button class="btn small toggle on slot-link" aria-pressed="true" title="이 화면의 TOP·BOTTOM 이동/확대를 함께 움직일지 선택 (끄면 각각 독립)">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="cut" d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>TOP·BOTTOM 연동</span>
          </button>
          <button class="btn small slot-open" title="이 화면에 파일 열기">열기</button>
          <button class="btn small slot-sample" title="이 화면에 샘플 열기">샘플</button>
        </div>
        <div class="panels"></div>
        <div class="drop">
          <div class="drop-card">
            <svg viewBox="0 0 24 24" width="40" height="40"><path d="M4 20h16M12 4v12m0-12 5 5m-5-5L7 9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <strong>거버 압축파일을 여기에 끌어다 놓으세요</strong>
            <span>또는 클릭하여 파일 선택<br>ZIP · RAR · 7Z · TAR(.gz/.bz2/.xz) · Gerber RS-274X / Excellon 드릴</span>
          </div>
        </div>
        <div class="busy" hidden><div class="spinner"></div><span class="busy-text">불러오는 중…</span></div>
      </div>
    </template>
  </main>

  <footer class="statusbar">
    <span id="stFile">파일 없음</span>
    <span id="stSize"></span>
    <span id="stCursor" class="mono"></span>
    <span class="hint">휠: 확대/축소 · 드래그: 이동 · 더블클릭: 맞춤</span>
  </footer>

  <script>
    // Namespace shared by the scripts below. Classic scripts (not ES modules) so the
    // viewer also works when index.html is opened directly from disk (file://).
    window.WG = {};
    // Never let a dropped file fall through to the browser's download/open behaviour.
    ['dragover', 'drop'].forEach(t => window.addEventListener(t, e => e.preventDefault()));
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/geom.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/gerber.js"></script>
  <script src="js/excellon.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
